name: secret-scan

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: Scan tree for secret-shaped strings
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v6
        with:
          fetch-depth: 1

      - name: Run secret scan
        run: bash .github/scripts/secret-scan.sh scan

  tripwire-self-test:
    name: Verify every regex still matches the fixture
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v6
        with:
          fetch-depth: 1

      - name: Run tripwire self-test
        run: bash .github/scripts/secret-scan.sh selftest
